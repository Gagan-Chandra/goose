# Builds the Windows installer and the Mac disk image on GitHub's own machines,
# and publishes them as a release whenever a version tag (v0.1.0, ...) is pushed.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Newer npm can skip packages' install steps. Run the window-reading
      # helper's install explicitly, then prove it loads, so a Windows build
      # can never ship without it.
      - name: Windows window helper
        if: runner.os == 'Windows'
        working-directory: app/node_modules/get-windows
        run: npx node-pre-gyp install --fallback-to-build
      - name: Check the window helper loads
        if: runner.os == 'Windows'
        run: node -e "import('get-windows').then(m => m.openWindows()).then(w => console.log('get-windows OK, windows visible:', w.length))"
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build
      - uses: actions/upload-artifact@v4
        with:
          name: goose-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Goose $GITHUB_REF_NAME" \
            --notes "Download **Goose-Setup** for Windows or the **.dmg** for Mac (Apple Silicon). See the README for the one-time security prompt."
