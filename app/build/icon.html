<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
  #bg{position:absolute;inset:0;border-radius:230px;
    background:radial-gradient(125% 125% at 28% 18%, #3f6d8e 0%, #2b4f6b 45%, #16324a 100%);}
  #pet{position:absolute;left:92px;top:212px;width:840px;height:630px}
  #pet svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 26px 30px rgba(120,60,10,.28))}
</style></head><body>
<div id="bg"></div><div id="pet"></div>
<script src="../cat.js"></script>
<script>
  const cat = new Cat(document.getElementById("pet"));
  cat.setPose("sit"); cat.tiltHead(-4); cat.s.blinkAt = 1e9; cat.s.twitchAt = 1e9;
  for (let i = 0; i < 200; i++) cat.update(1/60, { look: [520, 150] });
  cat.shadow.style.opacity = 0;
</script></body></html>
